# Every push and pull request: tests in both builds on three operating systems, the rules' own
# self-tests, and hadome checking itself against the base branch.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test with cgo (all six languages)
        run: go test ./...
      - name: Test without cgo (Go only)
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: Self-test every rule
        run: go run ./cmd/hadome self-test

  # hadome checks itself on one system: the result does not depend on it. Exit code 3 does not fail
  # the job. What needs a person's review is shown on the pull request instead, and the person who
  # merges it is the one who reviews it.
  hadome:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check hadome with hadome
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          # go run reports any non-zero exit of the program as 1, so the binary is built and run.
          go build -o "$RUNNER_TEMP/hadome" ./cmd/hadome
          report="$RUNNER_TEMP/hadome.json"
          "$RUNNER_TEMP/hadome" check --base "$BASE" || true
          code=0
          "$RUNNER_TEMP/hadome" check --base "$BASE" --format json > "$report" || code=$?
          if [ "$code" -ne 3 ]; then exit "$code"; fi
          # A workflow command ends at a newline, so %, CR and LF in a message are escaped.
          jq -r '
            def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            (.reviews[] | "::warning file=\(.file),line=\([.line, 1] | max),title=\(.rule)::\((.message + " — " + .why) | esc)"),
            (.new_exceptions[] | "::warning file=\(.file),line=\([.line, 1] | max),title=new exception for \(.rule)::\(("reason: " + .reason) | esc)")
          ' "$report"
          {
            echo "## hadome: a person must review"
            echo
            echo "Nothing regressed. Whoever merges this pull request reviews the items below."
            echo
            echo "| Rule | Where | What | Why |"
            echo "|---|---|---|---|"
            jq -r '
              def cell: tostring | gsub("\\|"; "\\|") | gsub("\n"; " ");
              (.reviews[] | "| `\(.rule)` | `\(.file)` | \(.message | cell) | \(.why | cell) |"),
              (.new_exceptions[] | "| new exception for `\(.rule)` | `\(.file):\(.line)` | reason: \(.reason | cell) | an exception needs a person to agree with its reason |")
            ' "$report"
          } >> "$GITHUB_STEP_SUMMARY"

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"
      - name: Build the packages of a pretend release, and use each one
        run: packaging/smoke.sh 0.0.0
