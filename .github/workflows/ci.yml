# Every push and pull request: tests in both builds, the rules' own self-tests, the readers of every
# SQL dialect, the packages, and hadome checking itself against the base branch. A pull request runs
# only what the files it changes can break; main runs everything.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request makes its older run worthless, so that run is cancelled. Runs on
# main each finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the pull request's files can break. Every output is true on main. A job reading an output
  # runs unless it is false, so a failure here runs everything rather than skipping a required check.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      macos: ${{ steps.files.outputs.macos }}
      packaging: ${{ steps.files.outputs.packaging }}
      sql: ${{ steps.files.outputs.sql }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf '%s\n' code=true macos=true packaging=true sql=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$RUNNER_TEMP/files"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate -q '.[].filename' > "$files"
          cat "$files"
          any() { if grep -Eq "$1" "$files"; then echo true; else echo false; fi; }
          shared='^(go\.mod|go\.sum|\.github/workflows/)'
          {
            # Anything but Markdown is code; documents alone need only the test of the documents.
            if grep -Evq '\.md$' "$files"; then echo code=true; else echo code=false; fi
            # What macOS can break that Linux cannot: the C of the grammars (in the modules), processes
            # and locks, and walking a file system that ignores case.
            echo "macos=$(any "$shared|^internal/(mutation|adapter/walk|source)/")"
            echo "packaging=$(any "$shared|^(packaging|cmd/hadome)/|^(LICENSE|THIRD_PARTY_NOTICES)$")"
            echo "sql=$(any "$shared|^internal/adapter/sql/")"
          } >> "$GITHUB_OUTPUT"

  # Linux and Windows test every pull request with code: a path written for one system can break the
  # other anywhere. A pull request of documents alone runs the test of the documents on Linux.
  test:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CODE: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The workflow in the cache key keeps this cache apart from the packaging job's, which would
      # otherwise save first, without the grammars' C built for the tests.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.CODE == 'true' || runner.os == 'Linux'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
      - name: Check formatting
        if: env.CODE == 'true' && runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l cmd internal)
          [ -z "$unformatted" ] || { echo "::error::not formatted with gofmt:"; echo "$unformatted"; exit 1; }
      - name: Test with cgo (all eight languages)
        if: env.CODE == 'true'
        run: go test ./...
      - name: Test without cgo (Go, Terraform and Ansible)
        if: env.CODE == 'true'
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: Self-test every rule
        if: env.CODE == 'true'
        run: go run ./cmd/hadome self-test
      - name: Test the documents
        if: env.CODE != 'true' && runner.os == 'Linux'
        run: go test ./cmd/hadome

  # macOS runs on main and for the files only it can break, since its runners are the scarcest. Its
  # name is the matrix's, so that skipping it passes the required check of that name.
  test-macos:
    name: test (macos-15)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.macos != 'false' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
      - name: Test with cgo (all eight languages)
        run: go test ./...
      - name: Test without cgo (Go, Terraform and Ansible)
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: Self-test every rule
        run: go run ./cmd/hadome self-test

  # The readers of SQL dialects that are not enabled are built only with the tag sqlgrammars. They
  # are pure Go, so one system checks them, in a job of its own so that it runs beside the others.
  # The grammars in the cache key give the job a build cache of its own: the cache the other jobs
  # save holds none of the grammars of dialects that are not enabled.
  sql-grammars:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.sql != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            internal/adapter/sql/grammar/**/*.go
      - name: Test and vet every SQL dialect
        run: |
          go test -tags sqlgrammars ./internal/adapter/sql/...
          go vet -tags sqlgrammars ./internal/adapter/sql/...

  # The fuzz targets run briefly with AddressSanitizer on every pull request with code. The
  # tree-sitter grammars are C, so ASan catches what Go cannot: reading or writing past their memory.
  # Each target gets its own run, since go test fuzzes one target at a time. The fuzz tests in the
  # cache key keep this cache apart from the others, whose packages are built without ASan.
  fuzz:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            internal/**/fuzz_test.go
      - name: Fuzz the tree-sitter readers with ASan
        run: go test -asan -run '^$' -fuzz '^FuzzTreeSitterReaders$' -fuzztime 30s ./internal/adapter/treesitter
      - name: Fuzz the configuration with ASan
        run: go test -asan -run '^$' -fuzz '^FuzzLoad$' -fuzztime 30s ./internal/config

  # hadome checks itself on one system: the result does not depend on it. Exit code 3 does not fail
  # the job. What needs a person's review is shown on the pull request instead, and the person who
  # merges it is the one who reviews it.
  hadome:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write # the comment that lists what a person must review
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml
      - name: Check hadome with hadome
        id: check
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          # go run reports any non-zero exit of the program as 1, so the binary is built and run.
          go build -o "$RUNNER_TEMP/hadome" ./cmd/hadome
          report="$RUNNER_TEMP/hadome.json"
          "$RUNNER_TEMP/hadome" check --base "$BASE" || true
          code=0
          "$RUNNER_TEMP/hadome" check --base "$BASE" --format json > "$report" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 3 ]; then exit 0; fi
          # A workflow command ends at a newline, so %, CR and LF in a message are escaped.
          jq -r '
            def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            (.reviews[] | "::warning file=\(.file),line=\([.line, 1] | max),title=\(.rule)::\((.message + " — " + .why) | esc)"),
            (.new_exceptions[] | "::warning file=\(.file),line=\([.line, 1] | max),title=new exception for \(.rule)::\(("reason: " + .reason) | esc)")
          ' "$report"
          {
            echo "<!-- hadome:review -->"
            echo "## hadome: a person must review"
            echo
            echo "Nothing regressed. Whoever merges this pull request reviews the items below; each is also marked on its line in Files changed."
            echo
            echo "| Rule | Where | What | Why |"
            echo "|---|---|---|---|"
            jq -r '
              def cell: tostring | gsub("\\|"; "\\|") | gsub("\n"; " ");
              def where: if .line > 0 then "\(.file):\(.line)" else .file end;
              (.reviews[] | "| `\(.rule)` | `\(where)` | \(.message | cell) | \(.why | cell) |"),
              (.new_exceptions[] | "| new exception for `\(.rule)` | `\(where)` | reason: \(.reason | cell) | an exception needs a person to agree with its reason |")
            ' "$report"
          } > "$RUNNER_TEMP/review.md"
          cat "$RUNNER_TEMP/review.md" >> "$GITHUB_STEP_SUMMARY"
      # One comment per pull request, edited in place on every run. A pull request from a fork gets a
      # read-only token, so it has the annotations and the job summary but no comment.
      - name: Comment what needs review
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.check.outputs.code }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q '.[] | select(.body | startswith("<!-- hadome:review -->")) | .id' | head -n 1)
          case "$CODE" in
            3) body="$RUNNER_TEMP/review.md" ;;
            0) [ -n "$id" ] || exit 0
               body="$RUNNER_TEMP/resolved.md"
               printf '%s\n\n%s\n' "<!-- hadome:review -->" "## hadome: nothing needs a person's review now" > "$body" ;;
            *) exit 0 ;;
          esac
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$body" > /dev/null
          fi
      - name: Fail on a regression or a check that could not run
        if: steps.check.outputs.code != '0' && steps.check.outputs.code != '3'
        run: exit ${{ steps.check.outputs.code }}

  packaging:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.packaging != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            packaging/smoke.sh
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "8.14.3"
      - name: Build the packages of a pretend release, and use each one
        run: packaging/smoke.sh 0.0.0
